services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_DB: ${postgres_db}
      POSTGRES_PASSWORD: ${postgres_password}
    ports:
      - "${postgres_port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${redis_port}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      postgres_host: postgres
      postgres_port: 5432
      redis_host: redis
      redis_port: 6379
      library_url: http://host.docker.internal:8001/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "src.worker"]
    restart: unless-stopped
    environment:
      postgres_host: postgres
      postgres_port: 5432
      library_url: http://host.docker.internal:8001/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    environment:
      CLUSTER_ID: J4Lp2QuJS7iQJ5y3h12W1g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:19092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:19092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic book-reservations --partitions 3 --replication-factor 1
        && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic book-reservations.dlq --partitions 1 --replication-factor 1

  relay:
    build: .
    env_file: .env
    command: ["python", "-m", "src.relay"]
    restart: unless-stopped
    environment:
      postgres_host: postgres
      postgres_port: 5432
      kafka_bootstrap_servers: kafka:9092
    depends_on:
      app:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "src.relay", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
