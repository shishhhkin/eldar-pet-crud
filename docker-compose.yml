services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_DB: ${postgres_db}
      POSTGRES_PASSWORD: ${postgres_password}
    ports:
      - "${postgres_port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      postgres_host: postgres
      postgres_port: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
